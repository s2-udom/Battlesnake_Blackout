name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: battlesnake

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Generate image tag
        id: meta
        run: echo "tag=${{ steps.login-ecr.outputs.registry }}/$IMAGE_NAME:${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.meta.outputs.tag }} .
          docker push ${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ needs.build.outputs.image_tag }}"
            aws ecr get-login-password --region eu-central-1 \
              | docker login --username AWS --password-stdin \
                ${{ steps.login-ecr.outputs.registry }}
            docker pull $IMAGE
            docker stop battlesnake-new 2>/dev/null || true
            docker run -d --name battlesnake-new \
              -p 8001:8000 --restart unless-stopped $IMAGE
            for i in {1..10}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/)
              if [ "$STATUS" == "200" ]; then break; fi
              sleep 2
            done
            if [ "$STATUS" != "200" ]; then
              docker stop battlesnake-new && docker rm battlesnake-new
              exit 1
            fi
            sudo sed -i 's/localhost:8000/localhost:8001/' /etc/nginx/conf.d/battlesnake.conf
            sudo nginx -s reload
            docker stop battlesnake 2>/dev/null || true
            docker rm battlesnake 2>/dev/null || true
            docker rename battlesnake-new battlesnake
            sudo sed -i 's/localhost:8001/localhost:8000/' /etc/nginx/conf.d/battlesnake.conf
            sudo nginx -s reload
            docker image prune -f
            echo "Deploy complete: $IMAGE"
